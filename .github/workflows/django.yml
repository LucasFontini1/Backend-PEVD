name: Django checks (Python 3.14)

on:
  push:
    branches: [main, dev, "FEAT-*"]
  pull_request:

jobs:
  checks:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install PDM
        run: python -m pip install "pdm>=2.20"
      - name: Select Python 3.14
        run: pdm use -f 3.14
      - name: Install dependencies
        run: pdm install
      - name: Confirm Python 3.14
        run: pdm run python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: Django system check
        run: pdm run python manage.py check
      - name: Check migrations
        run: pdm run python manage.py makemigrations --check --dry-run
      - name: Ruff lint
        run: pdm run lint
      - name: Run tests
        run: pdm run test
